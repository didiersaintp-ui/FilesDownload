{{- if and .Values.api.enabled .Values.api.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "devicemanifest-solution-b.serviceAccountName" . }}
  labels:
    {{- include "devicemanifest-solution-b.labels" . | nindent 4 }}
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
